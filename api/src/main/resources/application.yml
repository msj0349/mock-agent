spring:
  application:
    name: sql-converter-api
  
  datasource:
    url: jdbc:mysql://localhost:3306/sql_converter
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.project: DEBUG
    org.springframework: INFO
